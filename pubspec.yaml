name: budget_tracker
description: "A modern, offline-first personal budget and expense tracking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.24.2
  drift_flutter: ^0.2.3
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_mlkit_text_recognition: ^0.16.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  notification_listener_service: ^1.0.0
  riverpod_annotation: ^2.6.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.24.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

dependency_overrides:
  path_provider_foundation: 2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

flutter_native_splash:
  color: "#006C4C"
  image: "assets/splash/splash_logo.png"
  fullscreen: true
  android_12:
    color: "#006C4C"
    image: "assets/splash/splash_logo.png"
    icon_background_color: "#006C4C"
